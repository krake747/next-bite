pre-commit:
  commands:
    staged:
      run: pnpm exec vp staged --fail-on-changes --no-concurrent
    types:
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc -b --noEmit
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-push:
  commands:
    fmt-check:
      run: pnpm fmt:check
    lint:
      run: pnpm lint
    names:
      run: pnpm lint:names
    types:
      run: pnpm lint:ts
    test:
      run: pnpm test
    arch:
      run: pnpm check:arch
