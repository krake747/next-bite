pre-commit:
  commands:
    staged:
      run: pnpm exec vp staged --fail-on-changes --no-concurrent
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-push:
  parallel: true
  commands:
    fmt-check:
      run: pnpm fmt:check
    lint:
      run: pnpm lint
    types:
      run: pnpm lint:ts
    test:
      run: pnpm test:affected
    arch:
      run: pnpm check:arch
