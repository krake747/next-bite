name: Clean up PR preview

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete preview versions and deployment
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: preview
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # Must match worker.name in cloudflare.config.ts.
      WORKER_ID: next-bite
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONVEX_DEPLOY_TOKEN: ${{ secrets.CONVEX_DEPLOY_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Delete preview Worker versions
        run: |
          set -euo pipefail
          TAG="pr-${PR_NUMBER}"
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          WORK="$(mktemp -d)"
          trap 'rm -rf "${WORK}"' EXIT

          curl -sS --fail-with-body -H "${AUTH}" \
            "${BASE}/scripts/${WORKER_ID}/deployments?per_page=100" \
            -o "${WORK}/deployments.json"
          # First page only: a PR's versions are recent by construction.
          curl -sS --fail-with-body -H "${AUTH}" \
            "${BASE}/workers/${WORKER_ID}/versions?per_page=100" \
            -o "${WORK}/versions.json"

          python3 - "${WORK}/deployments.json" "${WORK}/versions.json" "${TAG}" > "${WORK}/ids.txt" <<'EOF'
          import json, sys
          deployments_path, versions_path, tag = sys.argv[1], sys.argv[2], sys.argv[3]
          deployed = set()
          with open(deployments_path) as f:
              payload = json.load(f)
          for deployment in payload.get("result") or []:
              for version in deployment.get("versions") or []:
                  vid = version.get("version_id") or version.get("id")
                  if vid:
                      deployed.add(vid)
          with open(versions_path) as f:
              payload = json.load(f)
          for version in payload.get("result") or []:
              annotations = version.get("annotations") or {}
              if annotations.get("workers/tag") == tag and version.get("id") not in deployed:
                  print(version["id"])
          EOF

          if [ ! -s "${WORK}/ids.txt" ]; then
            echo "No undeployed versions tagged ${TAG} to delete."
            exit 0
          fi
          while IFS= read -r VERSION_ID; do
            [ -n "${VERSION_ID}" ] || continue
            vp exec cf workers versions delete "${VERSION_ID}" --worker-id "${WORKER_ID}" --force
          done < "${WORK}/ids.txt"

      - name: Delete preview Convex deployment
        run: |
          set -euo pipefail
          IDENTIFIER="pr-${PR_NUMBER}"
          PREFIX="${CONVEX_DEPLOY_TOKEN%%|*}"
          SLUGS="${PREFIX#preview:}"
          TEAM="${SLUGS%%:*}"
          PROJECT="${SLUGS##*:}"
          if [ -z "${TEAM}" ] || [ "${TEAM}" = "${PREFIX}" ] || [ -z "${PROJECT}" ]; then
            echo "CONVEX_DEPLOY_TOKEN does not look like a preview deploy key."
            exit 1
          fi

          WORK="$(mktemp -d)"
          trap 'rm -rf "${WORK}"' EXIT
          FOUND=""
          # Preview deployments are addressed by reference preview/<identifier>.
          for REF in "preview/${IDENTIFIER}" "${IDENTIFIER}"; do
            CODE="$(curl -sS -o "${WORK}/deployment.json" -w "%{http_code}" \
              -H "Authorization: Bearer ${CONVEX_DEPLOY_TOKEN}" \
              "https://api.convex.dev/v1/teams/${TEAM}/projects/${PROJECT}/deployment?reference=${REF}")"
            if [ "${CODE}" = "200" ]; then
              FOUND="${REF}"
              break
            fi
            echo "No deployment at reference ${REF} (HTTP ${CODE})."
          done
          if [ -z "${FOUND}" ]; then
            echo "No ${IDENTIFIER} preview deployment to delete; it may have expired already."
            exit 0
          fi

          NAME="$(python3 -c "import json; print(json.load(open('${WORK}/deployment.json')).get('name', ''))")"
          if [ -z "${NAME}" ]; then
            echo "Deployment lookup returned no name; nothing to delete."
            exit 0
          fi
          CODE="$(curl -sS -o "${WORK}/delete.json" -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CONVEX_DEPLOY_TOKEN}" \
            "https://api.convex.dev/v1/deployments/${NAME}/delete")"
          if [ "${CODE}" = "404" ]; then
            echo "Preview deployment ${NAME} is already gone."
            exit 0
          fi
          if [ "${CODE}" != "200" ]; then
            cat "${WORK}/delete.json"
            echo "Deleting preview deployment ${NAME} failed (HTTP ${CODE})."
            exit 1
          fi
          echo "Deleted ${IDENTIFIER} preview deployment ${NAME}."

      - name: Comment that the preview is gone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="pr-${PR_NUMBER}"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "${BODY_FILE}"' EXIT
          cat > "${BODY_FILE}" <<EOF
          The preview for this pull request is gone. Worker versions tagged \`${TAG}\` that were not deployed were deleted, and the \`${TAG}\` Convex preview deployment was removed if it still existed.
          EOF
          gh pr comment "${PR_NUMBER}" --repo "${{ github.repository }}" --body-file "${BODY_FILE}"
