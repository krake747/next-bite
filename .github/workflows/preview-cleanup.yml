name: Clean up PR preview

# Step logic lives in .github/scripts/preview-cleanup-*.sh as small composed
# functions; this file stays declarative. No `convex deployment delete` exists,
# so deployment deletion stays on the management REST API.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number whose preview versions and deployment should be deleted
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete preview versions and deployment
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: preview
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONVEX_DEPLOY_TOKEN: ${{ secrets.CONVEX_DEPLOY_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Delete preview Worker versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/preview-cleanup-versions.sh

      - name: Delete preview Convex deployment
        run: .github/scripts/preview-cleanup-deployment.sh

      - name: Comment that the preview is gone
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/preview-cleanup-comment.sh
