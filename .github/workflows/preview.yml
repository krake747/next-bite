name: Preview environment

# Per-PR preview: one Convex preview deployment plus one Worker preview alias
# per PR, linked from a single sticky comment. Runs on pull_request (never
# pull_request_target) and skips forks, so the write token below only ever
# sees first-party code.
#
# Order matters. The Convex deploy runs first and may create the preview
# deployment; --preview-run fires only on creation and runs the baseline seed
# with the deployment admin key, the same privileged path the backend
# workflow uses for its internal migration. Internal-only functions are
# callable here (admin auth bypasses the public/internal boundary), so no
# separate seeding path is needed for visibility reasons. The explicit
# creation-gated seed step below still exists because --preview-run fires
# before the alias URL is known, while the seed fails closed without SITE_URL;
# it completes the baseline once SITE_URL points at the alias.
# Preview deployments are addressed by reference preview/<identifier>, the
# same form the cleanup workflow uses, so env and run target the preview
# without parsing deployment names out of URLs. Secrets come from the
# `preview` GitHub environment. Nothing here hardcodes values from any
# developer machine.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: preview
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # The CLI reads the deploy key from CONVEX_DEPLOY_KEY; the secret keeps
      # the name shared with the cleanup workflow and the environments doc.
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Deploy Convex preview backend
        id: backend
        run: |
          set -euo pipefail
          PREVIEW_NAME="pr-${PR_NUMBER}"
          if npx convex deploy --preview-name="$PREVIEW_NAME" --preview-run "seed:previewBaseline" 2>&1 | tee convex-deploy.log; then
            echo "convex deploy finished cleanly"
          elif grep -q "Deployed Convex functions to" convex-deploy.log; then
            # Push landed but --preview-run failed: on creation the seed runs
            # before this workflow can set SITE_URL, and the seed fails closed
            # without it. Continue; the creation-gated seed step below finishes
            # the baseline once SITE_URL is set.
            echo "convex push landed; continuing past the creation seed failure"
          else
            echo "convex push failed"
            exit 1
          fi
          CONVEX_URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.convex\.cloud' convex-deploy.log | head -1)"
          test -n "$CONVEX_URL"
          echo "VITE_CONVEX_URL=$CONVEX_URL" >> "$GITHUB_ENV"
          echo "VITE_CONVEX_SITE_URL=${CONVEX_URL/.convex.cloud/.convex.site}" >> "$GITHUB_ENV"
          # --preview-run fires only when the deployment is created, so any
          # mention of the seed in the log means this run created it.
          if grep -q "seed:previewBaseline" convex-deploy.log; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: vp run build

      - name: Upload Worker version
        run: |
          set -euo pipefail
          PREVIEW_NAME="pr-${PR_NUMBER}"
          vp exec cf workers versions create --preview-alias "$PREVIEW_NAME" --tag "$PREVIEW_NAME" 2>&1 | tee cf-upload.log
          ALIAS_URL="$(grep "Version Preview Alias URL" cf-upload.log | grep -oE 'https://[^[:space:]]+')"
          test -n "$ALIAS_URL"
          echo "PREVIEW_URL=$ALIAS_URL" >> "$GITHUB_ENV"

      - name: Point preview SITE_URL at the alias
        run: |
          set -euo pipefail
          npx convex env set SITE_URL "$PREVIEW_URL" --deployment "preview/pr-${PR_NUMBER}"

      - name: Seed preview baseline
        if: steps.backend.outputs.created == 'true'
        run: |
          set -euo pipefail
          # Idempotent (keyed by email, slug marker, and group name), so this
          # only fills the gap --preview-run could not cover on creation.
          npx convex run seed:previewBaseline --deployment "preview/pr-${PR_NUMBER}"

      - name: Update sticky preview comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIEW_NAME="pr-${PR_NUMBER}"
          BODY="<!-- preview-environment -->
          Preview: $PREVIEW_URL
          Backend: per-PR Convex preview deployment \`$PREVIEW_NAME\` with the seeded baseline."
          COMMENT_ID="$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate --jq '[.[] | select(.body | contains("<!-- preview-environment -->")) | .id] | first // empty')"
          if [ -z "$COMMENT_ID" ]; then
            gh api -X POST "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" -f body="$BODY"
          else
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -f body="$BODY"
          fi
