name: Release

# Manual release: dispatch computes the version, the gate waits for PR CI on the
# dispatched SHA, then build runs and cf deploys the Worker. A dry run builds
# and dry-runs the deploy without pushing the tag or publishing a release.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump (patch/minor/major)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Build and dry-run the deploy without tagging or releasing"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      GIT_TAG: ${{ steps.set-tag.outputs.GIT_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine Git tag
        id: set-tag
        run: |
          set -euo pipefail
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -1)
          if [[ -z "$LATEST_TAG" || ! "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MAJOR=0; MINOR=0; PATCH=0
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
          fi
          case "${{ inputs.bump_type }}" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          esac
          GIT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "GIT_TAG=$GIT_TAG" >> "$GITHUB_ENV"
          echo "GIT_TAG=$GIT_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate Git tag format
        run: |
          [[ "$GIT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Check tag is new
        if: ${{ !inputs.dry_run }}
        run: |
          if git tag -l | grep -q "^$GIT_TAG$"; then
            echo "Tag $GIT_TAG already exists."
            exit 1
          fi

  gate:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Wait for PR CI on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/pr.yml/runs?head_sha=$SHA&per_page=1" --jq '.workflow_runs[0].id // empty')
            [[ -n "$RUN_ID" ]] && break
            sleep 30
          done
          if [[ -z "${RUN_ID:-}" ]]; then
            echo "no CI run for $SHA; proceeding"
            exit 0
          fi
          for i in $(seq 1 40); do
            STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '[.status, .conclusion] | join("/")')
            echo "CI $STATUS"
            case "$STATUS" in
              completed/success) exit 0 ;;
              completed/*) echo "CI is not green; refusing to release" && exit 1 ;;
            esac
            sleep 30
          done
          echo "timed out waiting for CI"
          exit 1

  deploy:
    needs:
      - release
      - gate
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      VITE_CONVEX_SITE_URL: ${{ secrets.VITE_CONVEX_SITE_URL }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
    runs-on: ubuntu-latest
    outputs:
      WORKER_URL: ${{ steps.deploy.outputs.WORKER_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build and deploy
        id: deploy
        run: |
          set -euo pipefail
          vp run build
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            vp exec cf deploy --dry-run
          else
            vp exec cf deploy 2>&1 | tee deploy.log
            WORKER_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
            echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_OUTPUT"
            test -n "$WORKER_URL"
          fi

      - name: Verify Worker serves the build
        if: ${{ !inputs.dry_run }}
        env:
          WORKER_URL: ${{ steps.deploy.outputs.WORKER_URL }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -s --max-time 15 "$WORKER_URL" | grep -q "root"; then
              echo "worker serves the build at $WORKER_URL"
              exit 0
            fi
            sleep 10
          done
          echo "timed out waiting for marker at $WORKER_URL"
          exit 1

  publish:
    needs:
      - release
      - deploy
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push Git tag
        run: |
          git tag -a "${{ needs.release.outputs.GIT_TAG }}" -m "Release ${{ needs.release.outputs.GIT_TAG }}" "${{ github.sha }}"
          git push origin "${{ needs.release.outputs.GIT_TAG }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.release.outputs.GIT_TAG }}" \
            --title "${{ needs.release.outputs.GIT_TAG }}" \
            --generate-notes \
            --target "${{ github.sha }}"
