name: Convex backend

# Manual backend pipeline for the dev deployment, which production reads until
# the cutover: typechecks, deploys functions and schema, then runs migrations.

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run data migrations after deploy"
        required: true
        default: true
        type: boolean
      dry_run:
        description: "Typecheck only, no deploy and no migrations"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: convex-dev
  cancel-in-progress: false

jobs:
  gate:
    name: Full local gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: npx playwright install chromium --only-shell

      - name: Full local gate
        run: vp run check:full

  deploy:
    name: Deploy functions and schema
    needs: gate
    runs-on: ubuntu-latest
    environment: dev
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Deploy backend
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            npx convex deploy --dry-run
          else
            npx convex deploy
          fi

  migrate:
    name: Run data migrations
    needs:
      - deploy
    if: ${{ !inputs.dry_run && inputs.run_migrations }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Run migrations in order
        run: .github/scripts/backend-migrate.sh
