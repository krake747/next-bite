name: Main gate

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Check formatting
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm lint:ts

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Pure tests
        run: pnpm test:pure

      - name: Unit tests
        run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Integration tests
        run: pnpm test:integration

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: npx playwright install chromium --only-shell

      - name: Browser tests
        run: pnpm test:browser

  arch:
    name: Architecture audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Audit architecture
        env:
          FALLOW_AUDIT_BASE: origin/main
        run: pnpm check:arch

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Build
        run: pnpm build

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Collect coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  gate:
    name: Full local gate
    needs: [static, unit, integration, browser, arch, build, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Roll up job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -c "import json,os,sys; needs=json.loads(os.environ['NEEDS']); print({k: v['result'] for k,v in needs.items()}); sys.exit(0 if all(v['result'] in ('success','skipped') for v in needs.values()) else 1)"
