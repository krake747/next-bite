name: Main gate

on:
  push:
    branches: [main]

jobs:
  build:
    name: Full local gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Full local gate
        run: vp run check:full
