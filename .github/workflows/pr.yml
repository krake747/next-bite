name: Verify pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: filter
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- . ':!**.md' ':!docs/**' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: Static checks
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Check formatting
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm lint:ts

  unit:
    name: Unit tests
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Pure tests
        run: pnpm test:pure

      - name: Unit tests
        run: pnpm test:unit

  integration:
    name: Integration tests
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Integration tests
        run: pnpm test:integration

  browser:
    name: Browser tests
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: npx playwright install chromium --only-shell

      - name: Browser tests
        run: pnpm test:browser

  arch:
    name: Architecture audit
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Audit architecture
        env:
          FALLOW_AUDIT_BASE: origin/main
        run: pnpm check:arch

  build:
    name: Build
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Build
        run: pnpm build

  coverage:
    name: Code coverage
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup vp and install dependencies
        uses: ./.github/actions/setup-vp

      - name: Collect coverage
        run: pnpm test:coverage

      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2

  gate:
    name: Full local gate
    needs: [filter, static, unit, integration, browser, arch, build, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Roll up job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -c "import json,os,sys; needs=json.loads(os.environ['NEEDS']); print({k: v['result'] for k,v in needs.items()}); sys.exit(0 if needs['filter']['result'] == 'success' and all(v['result'] in ('success','skipped') for k,v in needs.items() if k != 'filter') else 1)"
